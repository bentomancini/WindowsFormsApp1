<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecfy - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0a0512;
            color: white;
            /* Remove totalmente qualquer barra de rolagem */
            overflow: hidden;
        }

        /* Centraliza o conteúdo na tela inteira */
        .pagina {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 360px;
            max-width: 90%;
            text-align: center;
        }

        .titulo-principal {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .titulo-destaque {
            color: #a855f7;
        }

        .subtitulo {
            color: #e5e7eb;
            font-size: 14px;
            line-height: 20px;
        }
    </style>
</head>

<body>

    <div class="pagina">
        <div class="card">
            <h1 class="titulo-principal">
                Bem-vindo
                <span class="titulo-destaque">
                    de volta!
                </span>
            </h1>

            <p class="subtitulo">
                Faça login para continuar curtindo<br>
                suas músicas favoritas.
            </p>
        </div>
    </div>

</body>

</html>
